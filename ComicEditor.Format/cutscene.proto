syntax = "proto3";
package comic_editor.cutscene.v1;
option csharp_namespace = "ComicEditor.Wire";

// Artwork pixels are row-major palette indexes 0..254. 255 means transparent.
// Version 1 had 16 palette entries; version 2 had 128; version 3 allows 2..255.
// A layer has exactly canvas_width * canvas_height bytes.
message CutsceneDocument {
  uint32 version = 1;
  uint32 canvas_width = 2;
  uint32 canvas_height = 3;
  repeated uint32 palette_rgb = 4; // 2..255 project-owned entries in version 3; each 0xRRGGBB.
  repeated Frame frames = 5;
  repeated Language languages = 6;
  string fallback_language = 7; // Missing/blank translations use this language, then blank.
  repeated string fallback_font_ids = 8; // Optional google:<family> references; fonts cached separately.
  repeated uint32 palette_rgba = 9; // Version 4 only: 0xRRGGBBAA; no byte-index limit.
}

message Frame {
  string id = 1;
  repeated ArtworkLayer layers = 2; // Ordered bottom to top.
  repeated TextObject text_objects = 3; // Drawn above artwork.
  bool text_hidden = 4; // False preserves text visibility in older files.
}

message ArtworkLayer {
  string id = 1;
  string name = 2;
  bool visible = 3;
  bytes pixels = 4;
  bytes rgba_png = 5; // Version 4 only: lossless 8-bit RGBA PNG.
}

message TextObject {
  string id = 1;
  string key = 2;
  float x = 3;
  float y = 4;
  float width = 5;
  float height = 6;
  string font_id = 7; // comic-shanns (default), google:<Google Fonts family>, system:<installed family>.
  float font_size = 8;
  uint32 palette_index = 9;
  bool bold = 10;
  bool italic = 11;
  repeated TextPlacementOverride placements = 12; // Optional per-language layout; base fields remain fallback.
  repeated TextStyleSpan styles = 13; // UTF-16 character ranges within one language's translation.
  float rotation_degrees = 14;
  uint32 size_effect = 15; // 0 normal, 1 grow, 2 shrink, 3 grow then shrink.
  float curve_degrees = 16; // Signed arc angle around the text area's center.
  float curve_anchor_x = 17; // Horizontal arc origin offset, as a fraction of text area width.
  float curve_anchor_y = 18; // Vertical arc origin offset, as a fraction of text area height.
}

message TextPlacementOverride {
  string language = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
}

message TextStyleSpan {
  string language = 1;
  uint32 start = 2;
  uint32 length = 3;
  string font_id = 4;
  float font_size = 5;
}

message Language {
  string code = 1; // For example en, es, pt, pt-BR.
  repeated Translation entries = 2;
}

message Translation {
  string key = 1;
  string value = 2;
}
