name: Deploy browser to Cloudflare Pages

on:
  workflow_run:
    workflows: ['Build and release']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build and release run whose WASM artifact should be deployed
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    environment:
      name: cloudflare-pages
      url: https://comic-editor.pages.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify successful trusted build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id || github.event.workflow_run.id }}
          AUTOMATIC: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '.conclusion == "success" and .name == "Build and release" and (.event == "push" or .event == "workflow_dispatch") and .head_repository.full_name == $repo' "$RUNNER_TEMP/build.json"
          sha=$(jq -r .head_sha "$RUNNER_TEMP/build.json")
          git merge-base --is-ancestor "$sha" origin/main
          if [ "$AUTOMATIC" = true ] && [ "$sha" != "$(git rev-parse origin/main)" ]; then
            echo 'Skipping superseded main build.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run=$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.build.outputs.deploy == 'true'
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        if: steps.build.outputs.deploy == 'true'
        with:
          version: '11.22.0'
      - name: Install deployment tools
        if: steps.build.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        if: steps.build.outputs.deploy == 'true'
        with:
          name: browser-wasm
          path: artifacts/download
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}
      - name: Prepare Pages assets
        if: steps.build.outputs.deploy == 'true'
        run: |
          unzip -q artifacts/download/ComicEditor-browser-wasm.zip -d artifacts/browser/wwwroot
          node tools/prepare-pages.mjs artifacts/browser/wwwroot artifacts/pages
      - name: Deploy production website
        if: steps.build.outputs.deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          node tools/ensure-pages-project.mjs
          pnpm exec wrangler pages deploy --project-name comic-editor --branch main --commit-hash "$BUILD_SHA" --commit-dirty=true
