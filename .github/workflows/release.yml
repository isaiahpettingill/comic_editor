name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'comic-editor-release' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Include draft releases when reserving version numbers.
    outputs:
      version: ${{ steps.version.outputs.version }}
      android_code: ${{ steps.version.outputs.android_code }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci-version.py plan

  tests:
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      COMIC_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      COMIC_ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.android_code }}
    steps:
      - uses: actions/checkout@v4
      - run: python tools/ci-version.py stamp
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tools/test-release-signing.mjs
      - run: dotnet test ComicEditor.Format.Tests/ComicEditor.Format.Tests.csproj --configuration Release
      - run: dotnet test ComicEditor.Rendering.Tests/ComicEditor.Rendering.Tests.csproj --configuration Release
      - name: Test Linux installer
        run: |
          bash -n tools/install-linux.sh
          python3 -m unittest discover -s tools -p 'test_linux_installer.py' -v
          python3 -m unittest discover -s tools -p 'test_macos_package.py' -v
          python3 -m unittest discover -s tools -p 'test_ci_version.py' -v

  desktop:
    needs: [prepare, tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    env:
      COMIC_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      COMIC_ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.android_code }}
    steps:
      - uses: actions/checkout@v4
      - run: python tools/ci-version.py stamp
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Linux AOT dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish native desktop app
        run: dotnet publish ComicEditor.Desktop/ComicEditor.Desktop.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o artifacts/${{ matrix.rid }}
      - name: Publish CLI compiler
        run: dotnet publish ComicEditor.Cli/ComicEditor.Cli.csproj -c Release -r ${{ matrix.rid }} -o artifacts/${{ matrix.rid }}/compiler
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sign desktop and compiler binaries
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          DESKTOP_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_SIGNING_PRIVATE_KEY }}
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          node tools/release-signing.mjs sign "artifacts/${{ matrix.rid }}/ComicEditor.Desktop$suffix" "artifacts/${{ matrix.rid }}/compiler/comic-compile$suffix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:COMIC_TEST_SIGNED_BINARY = (Resolve-Path "artifacts/${{ matrix.rid }}/ComicEditor.Desktop$suffix").Path
          dotnet test ComicEditor.Rendering.Tests -c Release --filter VerifyPublishedDesktopSignature
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Add licenses and schema
        shell: bash
        run: |
          cp LICENSE artifacts/${{ matrix.rid }}/
          cp -r licenses docs artifacts/${{ matrix.rid }}/
          cp -r signing artifacts/${{ matrix.rid }}/
          cp licenses/Comic-Shanns-MIT.txt artifacts/${{ matrix.rid }}/
          cp licenses/IconPacks-MIT.txt artifacts/${{ matrix.rid }}/
          cp licenses/MaterialDesignIcons-LICENSE.txt artifacts/${{ matrix.rid }}/
          cp licenses/Apache-2.0.txt artifacts/${{ matrix.rid }}/
          cp ComicEditor.Format/display.proto artifacts/${{ matrix.rid }}/
          cp ComicEditor.Format/cutscene.proto artifacts/${{ matrix.rid }}/
          cp ComicEditor/Assets/comic-editor.svg artifacts/${{ matrix.rid }}/
          cp ComicEditor/Assets/comic-editor.png artifacts/${{ matrix.rid }}/
          cp README.md artifacts/${{ matrix.rid }}/
      - name: Stamp updater metadata
        shell: bash
        run: python tools/write-update-manifest.py artifacts/${{ matrix.rid }} ${{ matrix.rid }} '${{ github.ref_name }}'
      - name: Audit release size and reject debug symbols
        shell: bash
        run: python tools/audit-release.py artifacts/${{ matrix.rid }}
      - name: Test native updater helper
        shell: bash
        run: python tools/test_update_helper.py artifacts/${{ matrix.rid }}
      - name: Test native compiler cached fonts and artwork
        shell: pwsh
        run: |
          $executable = if ($IsWindows) { 'comic-compile.exe' } else { 'comic-compile' }
          $env:COMIC_TEST_COMPILER = (Resolve-Path "artifacts/${{ matrix.rid }}/compiler/$executable").Path
          dotnet test ComicEditor.Rendering.Tests -c Release --filter NativeCompilerTests
      - name: Zip Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'artifacts/${{ matrix.rid }}/*' -DestinationPath 'ComicEditor-${{ matrix.rid }}.zip'
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --version=3.12.0 -y --no-progress
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: python tools/package-windows-installer.py artifacts/win-x64 ComicEditor-win-x64-setup.exe
      - name: Test Windows installer and update staging
        if: runner.os == 'Windows'
        run: python tools/test_windows_installer.py ComicEditor-win-x64-setup.exe artifacts/win-x64 --registered
      - name: Test NSIS updater integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:COMIC_TEST_SETUP = (Resolve-Path ComicEditor-win-x64-setup.exe).Path
          $env:COMIC_TEST_SETUP_PAYLOAD = (Resolve-Path artifacts/win-x64).Path
          dotnet test ComicEditor.Rendering.Tests -c Release --filter RealNsisPackageStagesAndSwapsThroughTheUpdater
      - name: Archive Unix build
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C artifacts/${{ matrix.rid }} -czf ComicEditor-${{ matrix.rid }}.tar.gz .
      - name: Package Linux installer
        if: runner.os == 'Linux'
        run: python3 tools/package-linux-installer.py
      - name: Package macOS Finder application
        if: runner.os == 'macOS'
        run: python3 tools/package-macos-app.py artifacts/${{ matrix.rid }} ComicEditor-${{ matrix.rid }}-app.zip
      - name: Sign desktop release packages
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          DESKTOP_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_SIGNING_PRIVATE_KEY }}
        run: |
          $files = @(Get-ChildItem -File 'ComicEditor-${{ matrix.rid }}*' | Where-Object { $_.Extension -ne '.sig' } | ForEach-Object FullName)
          if ($IsLinux) { $files += (Resolve-Path install-comic-editor.sh).Path }
          node tools/release-signing.mjs sign @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-installer
          path: ComicEditor-win-x64-setup.exe*
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: linux-installer
          path: |
            install-comic-editor.sh
            install-comic-editor.sh.sig
            ComicEditor-linux-x64.tar.gz.sha256
            ComicEditor-linux-x64.tar.gz.sha256.sig
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: ComicEditor-${{ matrix.rid }}*

  browser:
    needs: [prepare, tests]
    runs-on: ubuntu-24.04
    env:
      COMIC_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      COMIC_ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.android_code }}
    steps:
      - uses: actions/checkout@v4
      - run: python tools/ci-version.py stamp
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools
      - name: Publish WebAssembly AOT
        run: dotnet publish ComicEditor.Browser/ComicEditor.Browser.csproj -c Release -o artifacts/browser
      - name: Package static website
        run: |
          cp LICENSE README.md ComicEditor.Format/cutscene.proto ComicEditor.Format/display.proto artifacts/browser/wwwroot/
          cp -r licenses docs artifacts/browser/wwwroot/
          cd artifacts/browser/wwwroot
          zip -r ../../../ComicEditor-browser-wasm.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: browser-wasm
          path: ComicEditor-browser-wasm.zip

  android:
    if: github.event_name != 'pull_request'
    needs: [prepare, tests]
    runs-on: ubuntu-24.04
    env:
      COMIC_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      COMIC_ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.android_code }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: python tools/ci-version.py stamp
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android workload
        run: dotnet workload install android
      - name: Install Android SDK components
        run: >-
          dotnet build ComicEditor.Android/ComicEditor.Android.csproj -t:InstallAndroidDependencies
          -r android-arm64 -p:PublishAot=true -p:EnablePreviewFeatures=true
          -p:MicrosoftNETCoreAppRefPackageVersion=11.0.0-rc.1.26425.128
          -p:AndroidSdkDirectory=$ANDROID_HOME -p:JavaSdkDirectory=$JAVA_HOME
          -p:AcceptAndroidSdkLicenses=true
      - name: Require release signing secrets
        shell: bash
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing $name GitHub secret" >&2; exit 1; fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Publish signed Android AOT APK
        shell: bash
        run: |
          dotnet publish ComicEditor.Android/ComicEditor.Android.csproj -c Release -r android-arm64 \
            -p:PublishAot=true -p:EnablePreviewFeatures=true -p:AndroidPackageFormat=apk \
            -p:MicrosoftNETCoreAppRefPackageVersion=11.0.0-rc.1.26425.128 \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" \
            -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore" \
            -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" \
            -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"
          find ComicEditor.Android/bin/Release -name '*-Signed.apk' -exec cp '{}' ComicEditor-android-arm64.apk \;
          test -s ComicEditor-android-arm64.apk
      - name: Verify Android release identity
        shell: bash
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs ComicEditor-android-arm64.apk | tee "$RUNNER_TEMP/apk-signature.txt"
          expected=$(tr -d '\r\n' < signing/android-certificate.sha256)
          actual=$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | sort -u)
          test "$actual" = "$expected"
      - name: Remove temporary Android keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: ComicEditor-android-arm64.apk

  release:
    name: Publish GitHub release
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, desktop, android, browser]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      COMIC_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      COMIC_ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.android_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require and verify all desktop release signatures
        shell: bash
        run: |
          node tools/release-signing.mjs verify dist/ComicEditor-win-x64.zip dist/ComicEditor-win-x64-setup.exe dist/ComicEditor-linux-x64.tar.gz dist/ComicEditor-osx-x64.tar.gz dist/ComicEditor-osx-arm64.tar.gz dist/ComicEditor-osx-x64-app.zip dist/ComicEditor-osx-arm64-app.zip dist/install-comic-editor.sh
          cp signing/desktop-public.pem dist/
          cp signing/android-certificate.sha256 dist/
          python3 tools/ci-version.py source dist/ComicEditor-source.zip
          test -s dist/ComicEditor-android-arm64.apk
          test -s dist/ComicEditor-browser-wasm.zip
      - name: Upload complete draft and publish
        shell: bash
        run: |
          tag="v$COMIC_RELEASE_VERSION"
          if gh release view "$tag" --json isDraft,targetCommitish > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            jq -e --arg sha "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $sha' "$RUNNER_TEMP/release.json"
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "ComicEditor $tag" --generate-notes
          fi
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --draft=false --latest
